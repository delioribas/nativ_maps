# ⚠️  Generado desde `tool/analysis_options.template`. No editar a mano:
#     ejecuta `dart run tool/sync_analysis_options.dart` tras cambiar la
#     plantilla. Es una copia autocontenida a propósito — un `include:`
#     relativo hacia la raíz del repositorio desaparece dentro del archivo
#     que se sube a pub.dev y deja el paquete publicado sin análisis.

include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Un miembro público sin documentar es un fallo de compilación, no un
    # aviso. Los pub points piden dartdoc en el 20 % de la API pública; esto
    # exige el 100 %, que es lo que distingue un paquete que se puede usar
    # sin leer el código fuente.
    public_member_api_docs: error

    # `TODO` es una nota, no un defecto.
    todo: ignore

    # No contempla el caso de un campo privado con parámetro público
    # (`MapsClient({required AlsTransport transport}) : _transport = ...`).
    # Su sugerencia —`this._transport`— no es Dart válido: un parámetro con
    # nombre no puede ser privado.
    prefer_initializing_formals: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"

linter:
  rules:
    # ─── Corrección ────────────────────────────────────────────────────
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - comment_references
    - discarded_futures
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_self_assignments
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks

    # ─── Contrato público ──────────────────────────────────────────────
    # Estas son las que sostienen la promesa de versionado semántica: sin
    # ellas se rompe la API de ocho consumidores sin darse cuenta.
    - public_member_api_docs
    - use_to_and_as_if_applicable
    - avoid_returning_this
    - avoid_setters_without_getters
    - use_setters_to_change_properties

    # ─── Inmutabilidad y estilo ────────────────────────────────────────
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_expression_function_bodies
    - prefer_if_elements_to_conditional_expressions
    - prefer_single_quotes
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - use_named_constants
    - use_string_buffers

    # ─── Higiene ───────────────────────────────────────────────────────
    - always_use_package_imports
    - directives_ordering
    - sort_pub_dependencies
    - lines_longer_than_80_chars
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
