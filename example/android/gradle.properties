# ⚠️ Este paquete necesita JDK 21.
#
# `maplibre_gl` 0.27.0 compila su código Java con `sourceCompatibility 21`.
# Flutter, por su parte, usa el JDK que trae Android Studio —hoy el 17— y
# **prefiere ese antes que `JAVA_HOME`**, así que exportar la variable no
# basta. El síntoma es exactamente este:
#
#     error: invalid source release: 21
#
# Hay dos formas de arreglarlo, y ninguna se puede escribir aquí porque la
# ruta depende de cada máquina:
#
#   1. `flutter config --jdk-dir="/ruta/al/jdk-21"`  ← recomendada, global
#   2. descomentar la línea de abajo con tu ruta      ← local a este proyecto
#
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home
